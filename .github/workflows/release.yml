name: 检查与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - run: npm install --global pnpm@11.28.5
      - run: make install check
      - name: 构建四个平台的单文件程序
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: make release VERSION="$RELEASE_VERSION"
      - name: 验证内嵌资源
        run: |
          cd backend
          go test -tags production ./internal/webui ./internal/app
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: local/releases/*
          if-no-files-found: error

  container-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: joycurator:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: 检查容器启动、页面和数据库
        run: |
          docker run -d --name joycurator --platform linux/${{ matrix.arch }} -p 18081:8081 joycurator:test
          trap 'docker logs joycurator; docker rm -f joycurator' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 http://localhost:18081/api/health
          curl --fail http://localhost:18081/ | grep 'id="app"'
          docker exec joycurator ffprobe -version

  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, container-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 镜像名称与标签
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          name="ghcr.io/${REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          # 预发布版本不更新 latest。
          if [[ "$VERSION" != *-* ]]; then echo "latest=$name:latest" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.latest }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

  publish-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, container-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: binaries
      - name: 创建 Release 并上传程序与校验文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "JoyCurator $VERSION" --generate-notes "${options[@]}"
          fi
          gh release upload "$VERSION" binaries/* --clobber
