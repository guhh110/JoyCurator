services:
  joycurator:
    image: ghcr.io/guhh110/joycurator:${JOYCURATOR_VERSION:-latest}
    restart: unless-stopped
    user: "${JOYCURATOR_UID:-1000}:${JOYCURATOR_GID:-1000}"
    ports:
      - "8081:8081"
    environment:
      TZ: Asia/Shanghai
      JOYCURATOR_ADDR: 0.0.0.0:8081
      JOYCURATOR_DATA_DIR: /app/local/data
      JOYCURATOR_MEDIA_ROOTS: /media
      JOYCURATOR_SECURE_COOKIE: "false"
    volumes:
      - ./data:/app/local/data
      - ./media:/media
    stop_grace_period: 30s
