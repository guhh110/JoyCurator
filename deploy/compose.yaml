services:
  joycurator:
    image: ghcr.io/guhh110/joycurator:${JOYCURATOR_VERSION:-latest}
    restart: unless-stopped
    user: "${JOYCURATOR_UID:-1000}:${JOYCURATOR_GID:-1000}"
    ports:
      - "${WEB_PORT:-8081}:8081"
    environment:
      TZ: Asia/Shanghai
      JOYCURATOR_ADDR: 0.0.0.0:8081
      JOYCURATOR_DATA_DIR: /data
      JOYCURATOR_SOURCE_DIR: /source
      JOYCURATOR_TARGET_DIR: /target
      JOYCURATOR_SECURE_COOKIE: "false"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${SOURCE_DIR:-./source}:/source
      - ${TARGET_DIR:-./target}:/target
    stop_grace_period: 30s
